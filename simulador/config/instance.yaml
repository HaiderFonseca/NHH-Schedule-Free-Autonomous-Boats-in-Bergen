# Instancia de simulación — Entorno Gymnasium de despacho de barcos (tesis NHH)
#
# Única fuente de verdad de los parámetros compartidos por los 4 bloques del
# proyecto (simulador/, politica_base/, modelo_rl/, comparacion/ -- ver
# simulador/README.md para la estructura completa). Ver también
# docs/especificacion_simulador_rl.md para el diseño original (secciones §1-§12).

# ---------------------------------------------------------------------------
# Fuentes externas: nada se recalcula ni se redefine aquí. Nodos, capacidad,
# conexiones fuertes y tiempos de viaje vienen de bergen-boats/; el patrón de
# llegadas (gravedad + SSB + Poisson) viene de demand/.
# ---------------------------------------------------------------------------
fuentes_externas:
  # OJO: la capacidad del barco (flota.capacidad_pasajeros, hoy 20) y el nodo
  # inicial (flota.nodo_inicial) NO estan en este archivo -- se leen de aqui,
  # en bergen-boats/config/instance.yaml -> flota. Igual patron que ya usaba
  # demand/: cada carpeta es dueña de sus propios parametros, las demas los
  # leen, nunca los copian. Ver simulacion/README.md, seccion "De donde sale
  # cada parametro".
  nodos_config: "../bergen-boats/config/instance.yaml"
  matriz_tiempos_min: "../bergen-boats/02_ruteo_navegable/output/matriz_tiempos_min.csv"
  rutas_navegables_geojson: "../bergen-boats/02_ruteo_navegable/output/rutas_navegables.geojson"
  demand_config: "../demand/config/instance.yaml"
  demand_masas: "../demand/output/masas_por_nodo.csv"
  demand_intensidad_od: "../demand/output/matriz_intensidad_od.csv"

# ---------------------------------------------------------------------------
# Unidad de demanda (ajuste del usuario sobre la especificación original):
# "personas" (por defecto) explota cada grupo generado por demand/src en N
# unidades-persona (mismo origen/destino/minuto_llegada/paciencia del grupo,
# tamano=1 cada una). "grupos" usa el grupo tal cual (tamano=tamano_grupo).
# La regla de embarque es la misma función para ambos casos: con tamano=1
# colapsa exactamente a "sube de a uno hasta llenar capacidad".
# ---------------------------------------------------------------------------
unidad_demanda: "personas"   # "personas" | "grupos"

# ---------------------------------------------------------------------------
# Escala de demanda para verificación (NUNCA se toca demand/config/instance.yaml,
# que sigue siendo el oficial al 10%). Aquí se define una escala reducida propia
# de este paso, para que el escalón 1 tenga ~20-30 filas de grupos en la franja
# mañana (fácil de seguir a ojo) y el escalón 2 sea un día completo más denso.
# ---------------------------------------------------------------------------
escalones:
  escalon_1:
    descripcion: "Franja mañana (~3h), pocos barcos, pocos grupos -- primera verificación a ojo"
    horas: [6, 9]
    # Calibrado por barrido directo contra demand/output/ (semilla 42): 0.008
    # da 23 grupos / 202 personas en la franja mañana -- dentro del ~20-30
    # grupos pedido para la primera verificación.
    porcentaje_poblacion_dia: 0.008
    num_barcos: 2
  escalon_2:
    descripcion: "Dia completo, mas barcos, mas demanda -- metricas agregadas"
    horas: [6, 24]
    # Calibrado igual: 0.012 da 133 grupos / 1106 personas en el dia completo.
    porcentaje_poblacion_dia: 0.012
    num_barcos: 3
  escalon_3:
    descripcion: "Semana completa (7 dias, entre semana + fin de semana) -- metricas agregadas de una semana"
    horas: [6, 24]                   # mismo horario operativo que escalon_2, cada dia
    porcentaje_poblacion_dia: 0.012  # reusa la densidad de escalon_2 (mismo patron, mas dias)
    num_barcos: 3                    # reusa la flota de escalon_2
  escalon_toy:
    # Instancia de juguete para el diagnostico del agente RL (notebooks/04a_verificacion_toy_rl.ipynb):
    # 1 barco, 2 nodos (bryggen<->kleppesto, conexion fuerte, viaje corto), demanda chica,
    # franja mañana (90 pasos, igual que escalon_1) -- para iterar rapido si PPO aprende algo
    # antes de gastar tiempo entrenando sobre la instancia real. `nodos` es un campo nuevo,
    # solo lo usa este escalon -- EntornoDemandaAleatoria filtra la demanda generada a estos
    # nodos (ver src/entrenamiento.py, _generar_grupos).
    descripcion: "Instancia de juguete -- 1 barco, 2 nodos -- verificacion minima de que PPO aprende algo"
    horas: [6, 9]
    porcentaje_poblacion_dia: 0.05
    num_barcos: 1
    nodos: ["bryggen", "kleppesto"]
  escalon_dia_10pct:
    # Dia completo a la escala OFICIAL de demanda (demand/config/instance.yaml,
    # porcentaje_poblacion_dia=0.10 -- el mismo valor, repetido aqui solo para
    # trazabilidad, no una calibracion nueva). Fase heuristica fuerte (H0 vs H1,
    # politica_base/src/politica_h1.py) -- ver politica_base/notebooks/04_fleet_sweep_h0_h1.ipynb.
    # ~7994 pasajeros/dia esperados (79943 hab. de las 4 zonas x 0.10), numero
    # exacto reportado por semilla al generar (Poisson + Binomial, no determinista).
    descripcion: "Dia completo, demanda oficial (10% poblacion) -- estudio de flota H0 vs H1"
    horas: [6, 24]
    porcentaje_poblacion_dia: 0.10
    # Sin num_barcos fijo: el sweep de flota (subconjunto de
    # bergen-boats/config/instance.yaml -> flota.num_barcos_barrido) lo pasa
    # explicito por corrida, no se lee de aqui. Extendido a 10/12 (ademas de
    # 4/6/8) para ver si los rendimientos decrecientes de la curva de
    # servicio siguen bajando o ya se aplanan del todo.
    num_barcos_barrido: [4, 6, 8, 10, 12]

escalon_activo: "escalon_1"   # cual usan los notebooks por defecto

# ---------------------------------------------------------------------------
# Tiempo del simulador (§3 de la especificación): paso fijo de 2 min.
# ---------------------------------------------------------------------------
paso_tiempo_min: 2

# ---------------------------------------------------------------------------
# Recompensa (§7 de la especificacion, SIMPLIFICADA -- ver recompensa.py para
# la justificacion completa). Dos terminos: incomodidad (tiempo en el
# sistema, con techo por persona) y movimiento.
#
# Cambio de diseño importante: el simulador YA NO TIENE paciencia ni gente
# que se pierde (ver unidades.py/env.py) -- nadie se va nunca, espera hasta
# ser atendido. Por eso `penalizacion_maxima_persona` existe: sin paciencia,
# el sobrante de alguien muy retrasado podria crecer sin limite y dominar la
# recompensa; el techo evita eso sin volver a borrar a nadie de la cola.
# ---------------------------------------------------------------------------
recompensa:
  tolerancia_incomodidad_min: 12       # ruta directa mas larga (Kleppestø-Bryggen navegable, ~11.5 min a 30 km/h)
  sobrante_normalizador_min: 18        # ancho de la curva -- constante fija para todos (antes: paciencia - tolerancia, por unidad)
  penalizacion_maxima_persona: 100000     # techo de (sobrante/normalizador)^2 por persona -- evita que alguien muy retrasado domine la recompensa
  peso_movimiento: 0.003                 # penalizacion por barco navegando en el paso
  # Premio positivo por cada persona entregada a destino este paso (ver recompensa.py,
  # calcular_recompensa, parametro entregas_este_paso). Default 0.0: sin esto, escalones
  # 1-3 y politica base no cambian de comportamiento -- el termino es aditivo. Los
  # experimentos de entrenamiento RL NO tocan este valor por defecto -- usan su propio
  # override, ver agente.entrenamiento.recompensa_overrides mas abajo, precisamente para
  # no alterar retroactivamente la recompensa ya reportada de escalones 1-3.
  premio_por_persona_entregada: 0.0

# ---------------------------------------------------------------------------
# Agente de RL (PPO via Stable-Baselines3). `gamma` ya estaba declarado desde
# antes (especificacion §10). Infraestructura de entrenamiento (normalizacion,
# entropia, frecuencia de actualizacion) ya validada en una ronda de
# diagnostico anterior (ver modelo_rl/output/modelo_final/bitacora_experimentos.md,
# historico) -- NO se vuelve a tocar aqui, solo se explora la FORMA de la
# recompensa (agente.experimentos, abajo) antes de la corrida larga final
# (agente.entrenamiento).
# ---------------------------------------------------------------------------
agente:
  gamma: 0.99
  # Hiperparametros de PPO/entrenamiento COMPARTIDOS por los experimentos A/B/C
  # y por la corrida final -- solo cambia la recompensa entre ellos, nunca esto.
  hiperparametros:
    usar_vecnormalize: true        # VecNormalize (obs y reward) via DummyVecEnv, stable_baselines3.common.vec_env
    ent_coef: 0.01                 # sube la entropia (default SB3 = 0.0) -- mas exploracion
    learning_rate: 0.0003          # estandar de PPO (3e-4)
    n_steps: 512                   # mas chico que el default (2048): actualiza cada ~5-6 episodios de 90 pasos, no ~22
  experimentos:
    # Secuencia de experimentos sobre la FORMA de la recompensa, todos sobre
    # escalon_1 (manana, 2 barcos), entrenamientos CORTOS para iterar rapido
    # -- ver modelo_rl/notebooks/02_secuencia_experimentos_reward.ipynb.
    escalon_base: "escalon_1"
    semilla_entrenamiento: 123
    timesteps_exploracion: 30000    # ~7 min por experimento a ~73 pasos/seg en esta maquina
    A:
      descripcion: "Solo penalizacion de tiempo, CON techo por persona (el default de produccion)"
      recompensa_overrides: {tolerancia_incomodidad_min: 0,sobrante_normalizador_min: 1, peso_movimiento: 0.0, premio_por_persona_entregada: 0.0, penalizacion_maxima_persona: 1000000.0}
    B:
      descripcion: "Solo penalizacion de tiempo, SIN techo por persona -- hipotesis: mejor que A, porque sin techo el agente siente mas la urgencia de atender primero a quien lleva mas tiempo esperando (35 min y 50 min ya no penalizan igual)"
      recompensa_overrides: {tolerancia_incomodidad_min: 12,sobrante_normalizador_min: 1, peso_movimiento: 0.0, premio_por_persona_entregada: 0.0, penalizacion_maxima_persona: 1000000.0}
    C1:
      descripcion: "Sobre el ganador de A/B, penalizacion de movimiento pequena (0.003) -- una persona con ~13 min de espera penaliza (1/18)^2 = 0.003 con el normalizador de 18, asi que 0.003 es apenas del mismo orden: el punto de partida mas chico razonable a probar"
      recompensa_overrides: {peso_movimiento: 0.003, premio_por_persona_entregada: 0.0}   # penalizacion_maxima_persona: se copia la del ganador de A/B, no fija aqui
    C2:
      descripcion: "Igual que C1, pero peso_movimiento=0.001 -- mas chico todavia, para ver si a esta escala el agente deja de moverse/explorar por costarle casi nada, o si sigue moviendose igual de bien que C1"
      recompensa_overrides: {peso_movimiento: 0.001, premio_por_persona_entregada: 0.0}
  entrenamiento:
    # Corrida LARGA final, UNA sola vez. HASTA 2026-09-17 esto era el combo
    # ganador de agente.experimentos (C1, ver 02_secuencia_experimentos_reward.ipynb)
    # a 300000 timesteps -- ver `modelo_rl/README.md` para esos resultados
    # historicos, todavia documentados y no borrados. A partir de acá, la
    # recompensa "final" pasa a ser D (tiempo cuadratico puro, sin tolerancia
    # -- ver `modelo_rl/prueba_rewards/README.md` seccion 2.D), que en la
    # comparacion de `prueba_rewards/` (8 formulaciones, sobre las mismas 5
    # semillas de evaluacion) dio mejor tiempo medio Y maximo en sistema que
    # el combo C1 -- ver `modelo_rl/prueba_rewards/README.md` seccion 5.
    # `total_timesteps` se probo brevemente en 150000 (mismo presupuesto que
    # `prueba_rewards/`) y se volvio a 300000 -- el presupuesto grande de
    # siempre para EL modelo final, la reduccion fue un error de instruccion,
    # corregido el mismo dia.
    escalon_base: "escalon_1"      # de donde saca horas/porcentaje_poblacion_dia/num_barcos
    semilla_entrenamiento: 123     # semilla RAIZ de la secuencia de demandas de entrenamiento (reproducible)
    total_timesteps: 300000        # presupuesto grande para EL modelo final (no 150000 -- eso solo lo usan
                                    # prueba_rewards/ y el experimento n_steps=90 de abajo, aparte)
    # Overrides de recompensa SOLO para entrenar/evaluar el agente -- NO tocan la seccion
    # `recompensa:` de arriba (esa sigue gobernando escalones 1-3 y la politica base tal
    # cual, sin cambios). Config D completa (los 5 campos, no un override parcial sobre
    # `recompensa:` de arriba -- D es una formulacion propia, no una variacion de la de
    # produccion) -- misma fuente que `modelo_rl/prueba_rewards/config/instance.yaml`
    # -> recompensas.D, copiada a mano acá porque este archivo no puede importar el otro.
    recompensa_overrides:
      tolerancia_incomodidad_min: 0
      sobrante_normalizador_min: 12
      penalizacion_maxima_persona: 100000000000.0
      peso_movimiento: 0
      premio_por_persona_entregada: 0
  entrenamiento_n90:
    # Misma corrida larga de arriba (mismo combo de recompensa C1), pero con
    # n_steps=90 en vez de 512 -- prueba aparte sobre el largo del rollout, no
    # sobre la recompensa. 90 = la duracion de UN episodio completo en
    # escalon_1 (90 pasos de 2 min), asi que con esto PPO actualiza la red
    # justo al cerrar cada episodio, nunca a mitad de uno -- la alternativa
    # directa a elegir 512 sin mas justificacion que "funciono en el
    # diagnostico anterior" (ver modelo_rl/README.md seccion 4). No reemplaza
    # la corrida de agente.entrenamiento (n_steps=512) -- se guarda aparte y
    # se comparan las dos.
    # RESULTADO (ver modelo_rl/README.md seccion 4.1): en entrenamiento da
    # parecido a n_steps=512, pero en evaluacion (5 semillas) generaliza peor
    # en todo -- se queda n_steps=512 como el modelo final, esto se documenta
    # como negativo, no se adopta.
    escalon_base: "escalon_1"
    semilla_entrenamiento: 123
    total_timesteps: 150000
    n_steps: 90
    recompensa_overrides:
      peso_movimiento: 0.003
      penalizacion_maxima_persona: 1000000.0
      premio_por_persona_entregada: 0.0
  evaluacion:
    # Semillas fijas, fuera del rango que barre semilla_entrenamiento -- mismas
    # semillas para el agente y la politica base, para comparar en igualdad
    # de condiciones (ver comparacion/notebooks/05_comparacion_agente_vs_base.ipynb).
    semillas: [1001, 1002, 1003, 1004, 1005]

# ---------------------------------------------------------------------------
# Reproducibilidad: misma semilla -> misma corrida exacta.
# ---------------------------------------------------------------------------
semilla: 42
