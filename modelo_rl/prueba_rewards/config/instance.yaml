# Config propio de modelo_rl/prueba_rewards/ -- SOLO lo que esta subcarpeta
# decide por sí misma (la definición de las 4 recompensas A/B/C/D y sus
# parámetros, timesteps de entrenamiento). Todo lo demás (instancia
# escalon_1, hiperparámetros de PPO ya validados, semillas de evaluación)
# se LEE de ../../simulador/config/instance.yaml, nunca se copia -- misma
# regla de siempre en este proyecto.

# ---------------------------------------------------------------------------
# Fuentes externas.
# ---------------------------------------------------------------------------
fuentes_externas:
  simulador_config: "../../simulador/config/instance.yaml"

# ---------------------------------------------------------------------------
# Las 4 recompensas. Ver README.md para la teoría detrás de cada una.
#
# B y D reusan calcular_recompensa() de simulador/src/recompensa.py TAL
# CUAL (misma fórmula, solo cambia el cfg) -- por eso sus parámetros tienen
# los mismos nombres que simulador/config/instance.yaml -> recompensa.
# A y C son fórmulas nuevas (recompensas_alternativas.py) con sus propios
# parámetros.
# ---------------------------------------------------------------------------
recompensas:
  A:
    nombre: "Objetivo puro (identidad de Little)"
    descripcion: >
      Lineal en tiempo activo: penaliza cada persona activa por tamaño x
      duración del paso, sin tolerancia, sin técho, sin cuadrado, SIN
      MOVIMIENTO. Es el objetivo real (minimizar tiempo total en sistema)
      repartido paso a paso, sin pasar por ninguna curva de castigo ni
      ningún otro término.
      Corregido 2026-09-17: hasta esa fecha esta config traía
      `peso_movimiento: 0.006`, usado por calcular_recompensa_A para sumar
      un término de movimiento que NUNCA estuvo en la fórmula documentada
      -- un desajuste real entre código y documentación (no una variante
      intencional). Se quitó el parámetro y el término; A se reentrenó.

  B:
    nombre: "Ponderada convexa con tolerancia, sin techo"
    descripcion: >
      La formula ya usada en el resto de modelo_rl/ (ganadora C1 de la
      secuencia A/B/C1/C2 ya cerrada) -- referencia conocida, sin techo por
      persona, penalizacion de movimiento chica.
    tolerancia_incomodidad_min: 12
    sobrante_normalizador_min: 18
    penalizacion_maxima_persona: 1000000.0   # techo efectivamente infinito
    peso_movimiento: 0.003
    premio_por_persona_entregada: 0.0

  C:
    nombre: "B + potential-based shaping (Ng, Harada & Russell 1999)"
    descripcion: >
      Mismos parametros que B, mas un termino potencial gamma*Phi(s')-Phi(s)
      con Phi(s) = -eta * N(s) (N(s) = personas activas, ponderadas por
      tamano). Da senal densa por reducir la cola sin cambiar la politica
      optima (teorema de invariancia de PBRS) -- ver README.
    tolerancia_incomodidad_min: 12
    sobrante_normalizador_min: 18
    penalizacion_maxima_persona: 1000000.0
    peso_movimiento: 0.003
    premio_por_persona_entregada: 0.0
    eta_potencial: 0.05

  D:
    nombre: "sin tolerancia  (parametros de produccion)"
    descripcion: >
      calcular_recompensa() con los valores de PRODUCCION tal cual viven
      hoy en simulador/config/instance.yaml -> recompensa (tecno activo,
      peso_movimiento alto) -- nunca antes entrenados con RL. Sirve de
      contraste "mal escalado" sin inventar una quinta variante -- ver
      README, seccion D.
    tolerancia_incomodidad_min: 0
    sobrante_normalizador_min: 12
    penalizacion_maxima_persona: 100000000000.0
    peso_movimiento: 0
    premio_por_persona_entregada: 0

  # ---------------------------------------------------------------------
  # E, F, G, H -- agregadas DESPUES de A/B/C/D, sin tocarlas. Ver
  # README.md seccion 2 para la teoria y las formulas completas de cada
  # una. Ninguna usa tolerancia/normalizador/techo (a diferencia de
  # B/C/D) -- son formulaciones "puras" del tiempo en sistema, a proposito.
  # ---------------------------------------------------------------------
  E:
    nombre: "Tiempo lineal puro (sin normalizar, sin movimiento)"
    descripcion: >
      R = -sum(T_i), T_i = tiempo TOTAL en sistema de cada persona activa
      en este instante (no un costo fijo por paso, como A) -- sin
      tolerancia, sin normalizador, sin techo, sin termino de movimiento.
      calcular_recompensa_E en recompensas_alternativas.py.

  F:
    nombre: "Tiempo cuadratico puro (sin normalizar, sin movimiento)"
    descripcion: >
      R = -sum(T_i^2), sin dividir por ningun normalizador (a diferencia
      de D, que es (T_i/12)^2) -- version cruda, para ver si normalizar
      importa una vez VecNormalize ya esta activo. Sin movimiento.
      calcular_recompensa_F en recompensas_alternativas.py.

  G:
    nombre: "Tiempo incremental (delta T por paso)"
    descripcion: >
      R_t = -sum(deltaT_i), el INCREMENTO de tiempo en sistema ocurrido
      durante este paso de 2 min -- no el tiempo acumulado total (como E).
      Maneja correctamente llegadas a mitad de paso y entregas en el
      mismo paso, sin doble conteo -- ver README seccion 2.G para la
      derivacion. calcular_recompensa_G en recompensas_alternativas.py.

  H:
    nombre: "Multiobjetivo 95% tiempo cuadratico + 5% movimiento (SIN normalizar)"
    descripcion: >
      R = -[peso_tiempo * sum(T_i^2) + peso_movimiento * barcos_en_movimiento],
      combinacion ponderada explicita (no los pesos internos de
      calcular_recompensa) -- mismo J_T sin normalizar que F, mismo costo
      de movimiento (conteo de barcos navegando) que ya usan A/B/C/D. Ver
      README seccion 2.H para el problema de escala entre los dos
      terminos con estos pesos -- documentado, no corregido a mano. Esta
      version se conserva TAL CUAL (no se reentrena, no se borra) como el
      registro original del problema de escala -- ver H_normalizada abajo
      para la version corregida, guardada aparte.
    peso_tiempo: 0.95
    peso_movimiento: 0.05

  H_normalizada:
    nombre: "Multiobjetivo 95% tiempo cuadratico + 5% movimiento (normalizado)"
    descripcion: >
      Igual que H, pero J_T y J_M se dividen por una referencia FIJA antes
      de aplicar los pesos -- R = -[peso_tiempo*(J_T/j_tiempo_ref) +
      peso_movimiento*(J_M/j_movimiento_ref)]. La referencia se calculo UNA
      sola vez corriendo la politica BASE (nunca una politica RL, nunca H
      misma) sobre las 5 semillas de evaluacion estandar (1001-1005), en
      escalon_1 -- la MEDIANA por paso de J_T/J_M sobre esos 450 pasos (no
      el promedio: J_T varia demasiado entre semillas, una sola domina el
      promedio). Ver output/comparacion/referencia_H_normalizada.json para
      el detalle completo del calculo. calcular_recompensa_H_normalizada
      en recompensas_alternativas.py.
    peso_tiempo: 0.95
    peso_movimiento: 0.05
    j_tiempo_ref: 3473.192450393365
    j_movimiento_ref: 2.0

# ---------------------------------------------------------------------------
# Entrenamiento -- mismos hiperparametros de PPO para las 4 (se leen de
# simulador/config/instance.yaml -> agente.hiperparametros, no se redefinen
# aca), mismo total_timesteps y misma semilla_entrenamiento -- lo UNICO que
# cambia entre las 4 corridas es la recompensa.
# ---------------------------------------------------------------------------
entrenamiento:
  escalon_base: "escalon_1"      # de simulador/config/instance.yaml -> escalones
  semilla_entrenamiento: 123
  total_timesteps: 150000         # corto, para iterar -- igual que la secuencia A/B/C1/C2 ya cerrada

# ---------------------------------------------------------------------------
# Evaluacion -- mismas 5 semillas de siempre (fuera del rango de
# semilla_entrenamiento), leidas tambien de simulador/config/instance.yaml
# -> agente.evaluacion.semillas para no duplicar el numero aca.
# ---------------------------------------------------------------------------
evaluacion:
  usar_semillas_de: "agente.evaluacion.semillas"   # documentacion; el notebook lee el valor real de simulador/config
